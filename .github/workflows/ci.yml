name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Install
        working-directory: apps/site
        run: npm ci
      - name: Build
        working-directory: apps/site
        run: npm run build
      - name: "Check built size (code and art only; photos are excluded and lazy-loaded)"
        working-directory: apps/site
        run: |
          size=$(du -sk --exclude=photos dist | cut -f1)
          echo "dist size: ${size} KB"
          test "$size" -lt 3072
