name: Find photo candidates (Wikimedia Commons)

# Run manually. Saves candidate thumbnails + licence metadata to apps/site/photos/candidates for review.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'Query file relative to apps/site (blank = original dishes)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search Commons
        working-directory: apps/site
        run: node scripts/find-candidates.mjs "${{ inputs.queries }}"
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/photos/candidates
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "chore(photos): add candidate photos for review" && git push; fi
