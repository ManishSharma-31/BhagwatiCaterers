name: supabase-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://buqfsalxyregmnxnngvi.supabase.co
          K=sb_publishable_mPdfpobsxCjyJBWXRTjilw_BGSp80S_
          echo "--- records table (anon, expect 200 [] or 401, not 404)"
          curl -s -m 20 -w "\nHTTP %{http_code}\n" "$U/rest/v1/records?select=id&limit=1" -H "apikey: $K"
          echo "--- allowed_users"
          curl -s -m 20 -w "\nHTTP %{http_code}\n" "$U/rest/v1/allowed_users?select=user_id&limit=1" -H "apikey: $K"
          echo "--- auth settings (signup open?)"
          curl -s -m 20 "$U/auth/v1/settings" -H "apikey: $K" | python3 -c "import sys,json;d=json.load(sys.stdin);print('disable_signup=',d.get('disable_signup'),'email=',d.get('external',{}).get('email'))"
